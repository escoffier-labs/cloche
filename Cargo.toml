[package]
name = "cloche"
version = "0.7.0"
edition = "2024"
default-run = "cloche"
description = "Open-source desktop capture CLI for screenshots and agents"
license = "MIT"
repository = "https://github.com/escoffier-labs/cloche"
readme = "README.md"
rust-version = "1.88"
keywords = ["screenshot", "capture", "linux", "cli", "agents"]
categories = ["command-line-utilities"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/ROADMAP.md",
    "/scripts/*.ps1",
    "/scripts/*.sh",
    "/src/**/*.rs",
    "/src/*.html",
]

[[bin]]
name = "cloche"
path = "src/main.rs"

[[bin]]
name = "appshots"
path = "src/bin/appshots.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "thread_rng", "os_rng"] }
schemars = { version = "0.8", default-features = false, features = ["derive", "chrono"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }

# Linux serves the X11 clipboard through a detached process. Windows writes the
# clipboard in-process (the data outlives the process). `image-data` is the only
# feature enabled on both: it provides ImageData/set_image, and on Windows it
# pulls windows-sys and clipboard-win, which were already in Cargo.lock.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[dev-dependencies]
tempfile = "3.23"
